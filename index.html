    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
            },
            fontSize: {
              'xs': ['10px', { lineHeight: '14px' }], 'sm': ['11px', { lineHeight: '16px' }], 'base': ['13px', { lineHeight: '18px' }], 'lg': ['14px', { lineHeight: '20px' }], 'xl': ['16px', { lineHeight: '24px' }], '2xl': ['18px', { lineHeight: '26px' }], '3xl': ['20px', { lineHeight: '28px' }], '4xl': ['24px', { lineHeight: '32px' }], '5xl': ['30px', { lineHeight: '36px' }],
            },
            height: { 'control': '40px', 'control-textArea': '160px', },
            zIndex: { 'glass': '10', 'sticky': '40', 'overlay': '50', 'modal': '100', 'toast': '9999', },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))", },
              secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))", },
              destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))", },
              muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))", },
              accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))", },
              popover: { DEFAULT: "hsl(var(--popover))", foreground: "hsl(var(--popover-foreground))", },
              card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))", },
              palette: {
                mustard: '#7c3aed', copper: '#f97316', green: '#10b981', navy: '#0f0720', navyLight: '#1e1b38', purple: '#8b5cf6', red: '#f43f5e', yellow: '#facc15', brown: '#2e1065', cream: '#ede9fe', creamLight: '#f5f3ff',
              },
            },
            animation: { 'fade-in': 'fadeIn 0.3s ease-out', 'slide-in': 'slideIn 0.3s ease-out', 'zoom-in': 'zoomIn 0.2s ease-out', 'spin-slow': 'spin 6s linear infinite', 'spin-border': 'spin 7s linear infinite', 'float': 'float 6s ease-in-out infinite', 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite', 'shimmer': 'shimmer 3s infinite linear', },
            keyframes: { fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } }, slideIn: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { opacity: '1' } }, zoomIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { opacity: '1' } }, shimmer: { '0%': { transform: 'translateX(-150%) skewX(-20deg)' }, '100%': { transform: 'translateX(200%) skewX(-20deg)' } }, float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }, }
          }
        },

    <style type="text/tailwindcss">
      @layer base {
        :root {
          --background: 250 60% 98%; /* light lavender */
          --foreground: 240 10% 3.9%; /* near black */
          --card: 0 0% 100%; /* white */
          --card-foreground: 240 10% 3.9%;
          --popover: 0 0% 100%;
          --popover-foreground: 240 10% 3.9%;
          --primary: 258 84% 60%; /* #7c3aed */
          --primary-foreground: 0 0% 100%;
          --secondary: 240 5% 96%;
          --secondary-foreground: 240 10% 3.9%;
          --muted: 240 5% 90%;
          --muted-foreground: 240 4% 46%;
          --destructive: 0 84% 60%;
          --destructive-foreground: 0 0% 100%;
          --border: 240 6% 84%;
          --input: 240 6% 93%;
          --ring: 258 84% 60%;
        }

        .dark {
          --background: 240 22% 5%; /* palette-navy */
          --foreground: 0 0% 98%; /* near white */
          --card: 240 19% 9%; /* slightly lighter than bg */
          --card-foreground: 0 0% 98%;
          --popover: 240 19% 9%;
          --popover-foreground: 0 0% 98%;
          --primary: 258 84% 60%;
          --primary-foreground: 0 0% 100%;
          --secondary: 240 4% 16%;
          --secondary-foreground: 0 0% 98%;
          --muted: 240 4% 16%;
          --muted-foreground: 240 5% 65%;
          --destructive: 0 72% 51%;
          --destructive-foreground: 0 0% 100%;
          --border: 240 4% 16%;
          --input: 240 4% 12%;
          --ring: 258 84% 60%;
        }
      }
      
      @layer base {
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { @apply bg-background text-foreground transition-colors duration-300 text-base; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        /* --- ZIEZAN DESIGN SYSTEM v1.7 (Semantic Colors) --- */
        
        .glass-panel { @apply bg-card/60 backdrop-blur-xl border border-border rounded-[2rem] shadow-sm; }
        .glass-card { @apply bg-card/60 backdrop-blur-xl border border-border rounded-[1.5rem] shadow-sm transition-all duration-300; }
        .text-label { @apply text-xs font-black uppercase tracking-widest text-muted-foreground; }
        
        .input-standard, .input-glass, .select-glass {
          @apply h-control w-full bg-input border border-border rounded-2xl px-4 text-sm font-bold text-foreground focus:outline-none focus:ring-2 focus:ring-ring transition-all shadow-inner placeholder:text-muted-foreground;
        }
        .select-glass { @apply appearance-none cursor-pointer truncate; }
        
        .textarea-standard {
          @apply h-control-textArea w-full bg-input border border-border rounded-[1.5rem] p-4 text-sm font-bold text-foreground focus:outline-none focus:border-ring/60 focus:ring-2 focus:ring-ring/20 transition-all placeholder:text-muted-foreground resize-none shadow-inner;
        }

        .btn-primary {
          @apply h-control bg-primary text-primary-foreground rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-primary/30 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2;
        }
        .btn-glass {
          @apply h-control px-4 rounded-2xl bg-secondary hover:bg-muted text-secondary-foreground border border-border font-black text-xs tracking-widest transition-all active:scale-95 shadow-sm backdrop-blur-md flex items-center justify-center gap-2;
        }
        .btn-icon {
          @apply h-control w-[40px] flex items-center justify-center rounded-xl bg-card/40 border border-border text-foreground transition-all hover:scale-105 active:scale-90 shadow-sm backdrop-blur-md;
        }

        /* --- ZIEZAN Custom Auto-Hide Scrollbar --- */
        .custom-scrollbar {
          scrollbar-width: thin; /* For Firefox */
          scrollbar-color: hsl(var(--primary) / 0.4) transparent; /* For Firefox */
        }
        .custom-scrollbar::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background-color: transparent;
          border-radius: 10px;
          border: 3px solid transparent;
          background-clip: content-box;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
          background-color: hsl(var(--primary) / 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background-color: hsl(var(--primary) / 0.6);
        }
      }
      
      @layer utilities {
        .shimmer-surface {
          @apply relative overflow-hidden;
        }
        .shimmer-surface::after {
          content: '';
          @apply absolute inset-0 bg-[linear-gradient(110deg,transparent_40%,rgba(255,255,255,0.06)_50%,transparent_60%)] animate-shimmer pointer-events-none;
        }
      }

      .holo-gradient { background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.1) 100%); }
      .noise { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E"); }
    </style>
