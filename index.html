
<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Android / Google Play Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Ziezan Station POS" />
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ziezan POS" />
    <link rel="apple-touch-icon" href="https://beeimg.com/images/s77882238754.png" />
    
    <!-- Theme Color for Browser Address Bar -->
    <meta name="theme-color" content="#0f0720" />

    <link rel="icon" href="https://beeimg.com/images/s77882238754.png" />
    <title>Ziezan Station POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
            },
            fontSize: {
              'xs': ['10px', { lineHeight: '14px', letterSpacing: '0.02em' }], 
              'sm': ['12px', { lineHeight: '18px' }], 
              'base': ['14px', { lineHeight: '22px' }], 
              'lg': ['16px', { lineHeight: '24px' }], 
              'xl': ['18px', { lineHeight: '26px' }], 
              '2xl': ['20px', { lineHeight: '30px' }], 
              '3xl': ['24px', { lineHeight: '32px' }], 
              '4xl': ['30px', { lineHeight: '38px' }], 
              '5xl': ['36px', { lineHeight: '42px' }],
            },
            height: { 'control': '44px', 'control-textArea': '160px', },
            zIndex: { 'glass': '10', 'sticky': '40', 'overlay': '50', 'modal': '100', 'toast': '9999', },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))", },
              secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))", },
              destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))", },
              muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))", },
              accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))", },
              popover: { DEFAULT: "hsl(var(--popover))", foreground: "hsl(var(--popover-foreground))", },
              card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))", },
              palette: {
                mustard: '#8b5cf6', // Shifted to Purple as primary brand
                copper: '#f59e0b',  // Warning/Orange
                green: '#10b981',   // Success
                navy: '#0b0c15',    // Deep Dark BG
                navyLight: '#151621', // Card BG
                purple: '#a855f7',
                pink: '#ec4899',
                cyan: '#06b6d4',
              },
            },
            animation: { 
              'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)', 
              'slide-in': 'slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)', 
              'zoom-in': 'zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)', 
              'spin-slow': 'spin 8s linear infinite', 
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite', 
              'shimmer': 'shimmer 2.5s infinite linear', 
              'float': 'float 6s ease-in-out infinite',
              'bounce-soft': 'bounceSoft 2s infinite',
            },
            keyframes: { 
              fadeIn: { '0%': { opacity: '0', transform: 'translateY(5px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }, 
              slideIn: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { opacity: '1', transform: 'translateY(0)' } }, 
              zoomIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { opacity: '1', transform: 'scale(1)' } }, 
              shimmer: { '0%': { transform: 'translateX(-150%) skewX(-20deg)' }, '100%': { transform: 'translateX(200%) skewX(-20deg)' } }, 
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
              bounceSoft: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } }
            }
          }
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        :root {
          --background: 260 30% 98%; 
          --foreground: 240 10% 3.9%;
          --card: 0 0% 100%;
          --card-foreground: 240 10% 3.9%;
          --popover: 0 0% 100%;
          --popover-foreground: 240 10% 3.9%;
          --primary: 262 83% 58%; /* Vivid Purple */
          --primary-foreground: 0 0% 100%;
          --secondary: 240 5% 96%;
          --secondary-foreground: 240 10% 3.9%;
          --muted: 240 5% 90%;
          --muted-foreground: 240 4% 46%;
          --destructive: 0 84% 60%;
          --destructive-foreground: 0 0% 100%;
          --border: 240 6% 90%;
          --input: 240 6% 93%;
          --ring: 262 83% 58%;
        }

        .dark {
          --background: 240 20% 4%; /* #08080c */
          --foreground: 0 0% 98%;
          --card: 240 15% 8%;
          --card-foreground: 0 0% 98%;
          --popover: 240 15% 8%;
          --popover-foreground: 0 0% 98%;
          --primary: 263 70% 50%; /* Deep Purple */
          --primary-foreground: 0 0% 100%;
          --secondary: 240 4% 16%;
          --secondary-foreground: 0 0% 98%;
          --muted: 240 4% 16%;
          --muted-foreground: 240 5% 65%;
          --destructive: 0 72% 51%;
          --destructive-foreground: 0 0% 100%;
          --border: 240 4% 16%;
          --input: 240 4% 12%;
          --ring: 263 70% 50%;
        }
      }
      
      @layer base {
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { 
          @apply bg-background text-foreground transition-colors duration-300 antialiased selection:bg-primary/30 selection:text-primary; 
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        /* --- PREMIUM GLASS UI v2.0 --- */
        
        .glass-panel { 
          @apply bg-white/70 dark:bg-[#12121a]/70 backdrop-blur-xl border border-white/20 dark:border-white/5 rounded-[24px] shadow-lg; 
        }
        
        .glass-card { 
          @apply bg-white/50 dark:bg-[#181824]/60 backdrop-blur-md border border-white/30 dark:border-white/5 rounded-[20px] shadow-md transition-all duration-300; 
        }
        
        .text-label { 
          @apply text-[10px] font-bold uppercase tracking-widest text-muted-foreground/80; 
        }
        
        /* Inputs & Controls */
        .input-standard, .input-glass, .select-glass {
          @apply h-control w-full bg-white/50 dark:bg-black/20 border border-slate-200 dark:border-white/10 rounded-2xl px-4 text-sm font-semibold text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all placeholder:text-muted-foreground/50;
        }
        .select-glass { @apply appearance-none cursor-pointer; }
        
        .btn-primary {
          @apply h-control bg-primary hover:bg-primary/90 text-white rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-primary/25 hover:shadow-primary/40 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2;
        }
        .btn-glass {
          @apply h-control px-4 rounded-2xl bg-white/10 hover:bg-white/20 text-foreground border border-white/10 font-bold text-xs tracking-widest transition-all active:scale-95 backdrop-blur-md flex items-center justify-center gap-2;
        }
        .btn-icon {
          @apply h-10 w-10 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 text-foreground transition-all hover:scale-110 active:scale-90;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-white/10 rounded-full hover:bg-slate-400 dark:hover:bg-white/20; }
        
        /* Subtle Noise Texture for "Paper" feel */
        .noise-bg {
          position: relative;
        }
        .noise-bg::before {
          content: "";
          position: absolute;
          inset: 0;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
          pointer-events: none;
          z-index: 0;
        }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.309.0?external=react",
    "recharts": "https://esm.sh/recharts@2.10.4?external=react,react-dom",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
