
<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Android / Google Play Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Ziezan Station POS" />
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ziezan POS" />
    <link rel="apple-touch-icon" href="https://beeimg.com/images/s77882238754.png" />
    
    <!-- Theme Color for Browser Address Bar -->
    <meta name="theme-color" content="#7c3aed" />

    <link rel="icon" href="https://beeimg.com/images/s77882238754.png" />
    <title>Ziezan Station POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
            },
            // WORLD CLASS TYPOGRAPHY SYSTEM v2.0 (Optimized for readability)
            fontSize: {
              'xs': ['11px', { lineHeight: '16px' }],      // Label kecil / Tag
              'sm': ['13px', { lineHeight: '20px' }],      // Secondary text / Body Small
              'base': ['15px', { lineHeight: '24px' }],     // Standard Body Text (Readable)
              'lg': ['16px', { lineHeight: '26px' }],       // Sub-heading
              'xl': ['18px', { lineHeight: '28px' }],       // Standard Heading
              '2xl': ['22px', { lineHeight: '30px' }],      // Large Heading
              '3xl': ['26px', { lineHeight: '34px' }],      // Extra Large
              '4xl': ['32px', { lineHeight: '40px' }],      // Hero Title
              '5xl': ['40px', { lineHeight: '48px' }],      // Display
            },
            height: {
              'control': '48px',      // UPDATED: 48px Standard Touch Target (iOS/Android Standard)
              'control-sm': '36px',   // Compact button
              'control-textArea': '160px', 
            },
            zIndex: {
              'glass': '10',
              'sticky': '40',
              'overlay': '50',
              'modal': '100',
              'toast': '9999',
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              mythic: '#ffd700',
              immortal: '#ff4d4d',
              palette: {
                mustard: '#7c3aed',
                copper: '#f97316',
                green: '#10b981',
                navy: '#0f0720',
                navyLight: '#1e1b38',
                purple: '#8b5cf6',
                red: '#f43f5e',
                yellow: '#facc15',
                brown: '#2e1065',
                cream: '#ede9fe',
                creamLight: '#f8fafc', // Cleaner light bg
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)', // Smooth Apple-like easing
              'slide-in': 'slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'zoom-in': 'zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'spin-slow': 'spin 8s linear infinite',
              'spin-border': 'spin 7s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2.5s infinite linear',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideIn: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              zoomIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
              shimmer: { '0%': { transform: 'translateX(-150%) skewX(-20deg)' }, '100%': { transform: 'translateX(200%) skewX(-20deg)' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            }
          }
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { @apply bg-palette-creamLight text-slate-800 dark:bg-palette-navy dark:text-palette-cream transition-colors duration-300 text-base antialiased; }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-white/10 rounded-full hover:bg-palette-mustard transition-colors; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        
        /* --- ZIEZAN DESIGN SYSTEM v2.0 (Audit Visibility & Comfort) --- */
        
        /* 1. Containers & Panels */
        .glass-panel {
          @apply bg-white/60 dark:bg-[#0f1016]/60 backdrop-blur-2xl border border-slate-200 dark:border-white/10 rounded-[2rem] shadow-sm hover:shadow-md transition-shadow duration-300;
        }
        .glass-card {
          @apply bg-white/70 dark:bg-[#0f1016]/70 backdrop-blur-2xl border border-slate-200 dark:border-white/10 rounded-[1.75rem] shadow-sm transition-all duration-300;
        }

        /* 2. Typography */
        .text-label {
          @apply text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-slate-500;
        }

        /* 3. Input Fields (Fixed 48px for Accessibility) */
        .input-standard {
          @apply h-control w-full bg-slate-100 dark:bg-black/40 border border-slate-200 dark:border-white/10 rounded-2xl px-5 text-base font-semibold focus:outline-none focus:ring-2 focus:ring-palette-mustard/50 focus:border-palette-mustard transition-all shadow-sm text-slate-900 dark:text-white placeholder:text-slate-400;
        }
        .input-glass {
          @apply h-control w-full bg-white/60 dark:bg-black/40 border border-slate-200 dark:border-white/10 rounded-2xl px-5 text-base font-semibold focus:outline-none focus:ring-2 focus:ring-palette-mustard/50 transition-all shadow-sm backdrop-blur-md text-slate-900 dark:text-white placeholder:text-slate-400;
        }
        .select-glass {
          @apply h-control w-full bg-white/60 dark:bg-black/40 border border-slate-200 dark:border-white/10 rounded-2xl px-5 text-base font-semibold focus:outline-none focus:ring-2 focus:ring-palette-mustard/50 transition-all shadow-sm backdrop-blur-md text-slate-900 dark:text-white appearance-none cursor-pointer truncate;
        }
        
        /* 4. Text Areas */
        .textarea-standard {
          @apply w-full bg-slate-100 dark:bg-black/40 border border-slate-200 dark:border-white/10 rounded-[1.5rem] p-5 text-base font-semibold text-slate-900 dark:text-white focus:outline-none focus:border-palette-mustard focus:ring-2 focus:ring-palette-mustard/20 transition-all placeholder:text-slate-400 resize-none shadow-inner;
        }

        /* 5. Buttons */
        .btn-primary {
          @apply h-control bg-palette-mustard text-white rounded-2xl font-bold text-sm uppercase tracking-wider shadow-lg shadow-palette-mustard/25 hover:shadow-palette-mustard/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all flex items-center justify-center gap-2.5 px-6;
        }
        .btn-glass {
          @apply h-control px-6 rounded-2xl bg-white/60 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-white font-bold text-sm tracking-wider hover:bg-white/80 dark:hover:bg-white/10 transition-all active:scale-95 shadow-sm backdrop-blur-md flex items-center justify-center gap-2.5;
        }
        .btn-icon {
          @apply h-control w-[48px] flex items-center justify-center rounded-2xl bg-white/60 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-palette-cream transition-all hover:bg-white dark:hover:bg-white/10 hover:scale-105 active:scale-95 shadow-sm backdrop-blur-md;
        }
      }
      .holo-gradient {
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.1) 100%);
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",

    "vite": "https://esm.sh/vite@^7.3.1",

    "html2canvas": "https://esm.sh/html2canvas@1.4.1"
  }
}
</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
