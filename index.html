
<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Android / Google Play Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Ziezan Station POS" />
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ziezan POS" />
    <link rel="apple-touch-icon" href="https://beeimg.com/images/s77882238754.png" />
    
    <!-- Theme Color for Browser Address Bar -->
    <meta name="theme-color" content="#0f0720" />

    <link rel="icon" href="https://beeimg.com/images/s77882238754.png" />
    <title>Ziezan Station POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="portrait-enforcer">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 2rem; animation: rotatePhonePortrait 2s infinite ease-in-out;">
        <rect width="20" height="14" x="2" y="5" rx="2" ry="2"/>
        <path d="M18 12h.01"/>
      </svg>
      <h2 style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; text-transform: uppercase;">Rotate Device</h2>
      <p style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.875rem; color: #94a3b8; max-width: 300px; line-height: 1.5;">Aplikasi ini membutuhkan mode portrait untuk pengalaman mobile/tablet terbaik.</p>
      
      <style>
        @keyframes rotatePhonePortrait {
          0% { transform: rotate(0deg); }
          50% { transform: rotate(90deg); }
          100% { transform: rotate(90deg); }
        }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
